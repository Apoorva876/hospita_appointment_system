{% extends 'base.html' %}

{% block title %}Confirm Deletion - MediCare Admin{% endblock %}

{% block content %}
<div class="container" style="padding-top: 3.5rem; padding-bottom: 4rem; max-width: 580px;">
  <div class="card" style="box-shadow: var(--shadow-lg); border-top: 4px solid var(--danger);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="width: 64px; height: 64px; border-radius: var(--radius-full); background: #fee2e2; color: var(--danger); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h1 style="font-size: 1.7rem; color: var(--dark); margin-bottom: 0.5rem;">Confirm Permanent Deletion</h1>
      <p style="color: var(--text-muted); font-size: 1rem;">
        Are you sure you want to delete <strong>{{ object_name }}</strong>?
      </p>
    </div>

    {% if warning_text %}
      <div class="alert alert-warning" style="margin-bottom: 1.75rem;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <div>{{ warning_text }}</div>
      </div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div style="display: flex; gap: 1rem; justify-content: flex-end;">
        <a href="{% url cancel_url %}" class="btn btn-outline" style="flex: 1; text-align: center;">
          <i class="fa-solid fa-arrow-left"></i> Cancel & Keep
        </a>
        <button type="submit" class="btn btn-danger" style="flex: 1;">
          <i class="fa-solid fa-trash-can"></i> Yes, Delete
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
